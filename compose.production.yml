name: solar-erp

services:
  malware-scanner:
    image: ${CLAMAV_IMAGE:?Set CLAMAV_IMAGE to an approved immutable image digest}
    restart: unless-stopped
    networks:
      - services
      - egress
    volumes:
      - malware-signatures:/var/lib/clamav
    security_opt:
      - no-new-privileges:true

  api:
    image: ${API_IMAGE:-solar-erp-api:local}
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env.production}
    environment:
      MALWARE_SCAN_COMMAND: python /app/scripts/clamd_scan.py --host malware-scanner --port 3310 {path}
      REQUIRE_MALWARE_SCAN: "true"
      STORAGE_TEMP_PATH: /tmp/solar-erp
    depends_on:
      malware-scanner:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp/solar-erp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - services

  migrate:
    image: ${API_IMAGE:-solar-erp-api:local}
    profiles:
      - release
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env.production}
    environment:
      BACKUP_REFERENCE: ${BACKUP_REFERENCE:?Set BACKUP_REFERENCE to a verified recovery point}
    entrypoint:
      - /app/scripts/run_production_migrations.sh
    read_only: true
    tmpfs:
      - /tmp/solar-erp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - services
      - egress

  frontend:
    image: ${FRONTEND_IMAGE:-solar-erp-frontend:local}
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0700
      - /var/cache/nginx:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    networks:
      - edge

networks:
  edge:
  services:
    internal: true
  egress:

volumes:
  malware-signatures:
